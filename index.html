<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Stadium - Arselen C.F.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stadium-page">

        <!-- TITRE -->
        <header>
            <div class="stadium-icon">🏟️</div>
            <h1>OUR <span>STADIUM</span></h1>
        </header>


        <!-- GRANDE IMAGE -->
        <section class="hero">

            <div class="player">
                <img src="img1.png" alt="img1">
            </div>

            <div class="description">
                <p>Plus qu'un stade...</p>
                <strong>une passion !</strong>
            </div>

        </section>


        <!-- IMAGES DU STADE -->
        <section class="gallery">

            <div class="stadium-card big">
                <img src="img2.png" alt="Vue intérieure du stade">
                <div class="caption">
                    📍 VUE INTÉRIEURE DU STADE
                </div>
            </div>

            <div class="stadium-card">
                <img src="img4.png" alt="Vue panoramique">
                <div class="caption">
                    📍 VUE PANORAMIQUE
                </div>
            </div>

            <div class="stadium-card">
                <img src="img6.webp" alt="Vue du stade">
                <div class="caption">
                    📍 VUE DE L'INTÉRIEUR
                </div>
            </div>

        </section>


        <!-- PETIT STADE -->
        <div class="mini-stadium">
            🏟️
        </div>

    </div>

</body>
</html>
